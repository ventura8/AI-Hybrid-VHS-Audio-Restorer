services:
  ubuntu_test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ubuntu
    container_name: vhs_restorer_ubuntu_test
    volumes:
      - ../:/app
      - ubuntu_venv:/app/.venv

  macos_test:
    image: dockurr/macos@sha256:08d1bcaac74ad44d548b7ce683b3dded083512d2a0d26416f9a620b763f8ea3d
    container_name: vhs_restorer_macos_test
    environment:
      VERSION: "sonoma"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:8006:8006"
    volumes:
      - ../:/shared

  windows_test:
    image: dockurr/windows@sha256:0cff9eb0e7aee9953e55bc682852ca4fdca233145a58ae1ec94f0b0c01a2ed30
    container_name: vhs_restorer_windows_test
    environment:
      VERSION: "win11"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:8007:8006"
      - "127.0.0.1:3389:3389/tcp"
      - "127.0.0.1:3389:3389/udp"
    volumes:
      - ../:/shared

volumes:
  ubuntu_venv:
