[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ai-hybrid-vhs-audio-restorer"
version = "1.2.1"
description = "Hybrid AI VHS audio restoration pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]
authors = [{ name = "AI Hybrid VHS Audio Restorer Team" }]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
numpy = "^2.5.2"
scipy = "^1.18.1"
soundfile = "^0.14.0"
pyyaml = "^6.0.3"
tqdm = "^4.70.0"
pyloudnorm = "^0.2.0"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
# All three from the same CUDA index. torchaudio used to come from PyPI, which builds it
# against CUDA 13.0 while torch was pinned to +cu132 -- torchaudio then refuses to import:
#   "PyTorch has CUDA version 13.2 whereas TorchAudio has CUDA version 13.0"
# That killed every mode invoking resemble-enhance (auto, multipass_auto, hybrid) on Linux.
# Windows escaped it only because pip resolves torchaudio to a +cpu build there, whose CUDA
# check is skipped. cu130 is the index that carries a matched set for all three.
torch = [
  { version = "2.13.0+cu130", source = "pytorch-cu130", markers = "platform_system != 'Darwin' and python_version == '3.12' and implementation_name == 'cpython'" },
  { version = "^2.13.0", markers = "platform_system == 'Darwin' and python_version == '3.12' and implementation_name == 'cpython'" },
]
torchvision = [
  { version = "0.28.0+cu130", source = "pytorch-cu130", markers = "platform_system != 'Darwin' and python_version == '3.12' and implementation_name == 'cpython'" },
  { version = "^0.28.0", markers = "platform_system == 'Darwin' and python_version == '3.12' and implementation_name == 'cpython'" },
]
torchaudio = [
  { version = "2.11.0+cu130", source = "pytorch-cu130", markers = "platform_system != 'Darwin' and python_version == '3.12' and implementation_name == 'cpython'" },
  { version = "^2.11.0", markers = "platform_system == 'Darwin' and python_version == '3.12' and implementation_name == 'cpython'" },
]
audio-separator = [
  { version = "^0.47.0", extras = [
    "gpu",
  ], markers = "platform_system != 'Darwin'" },
  { version = "^0.47.0", markers = "platform_system == 'Darwin'" },
]
onnxruntime-gpu = { version = "~1.29.0", markers = "platform_system != 'Darwin'" }
onnxruntime = { version = "^1.29.0", markers = "platform_system == 'Darwin'" }
librosa = "^1.0.0"
# Declared explicitly because audio-separator imports it without declaring it, and
# librosa 1.0 dropped the transitive dependency that used to supply it. Without this the
# next lock regeneration silently removes audioread and every UVR-based mode dies on
# "audio-separator is required for stem separation/denoising".
audioread = "^3.1.0"
fastdtw = "^0.3.4"
transformers = "^5.16.1"
accelerate = "^1.14.0"
omegaconf = "^2.3.1"
rich = "^15.0.0"
loguru = "^0.7.3"
pandas = "^3.0.5"
matplotlib = "^3.11.1"
tabulate = "^0.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
coverage = "^7.16.0"
flake8 = "^7.3.0"
ruff = "^0.16.5"
pylint = "^4.0.8"
radon = "^6.0.1"
mypy = "^2.3.1"
mdformat = "^1.0.0"
pymarkdownlnt = "^0.9.39"
isort = "^9.0.1"
black = "^26.5.1"
taplo = "^0.9.3"
bandit = "^1.9.4"
pip-audit = "^2.10.1"
genbadge = "^1.1.3"
pip = ">=26.2.1"
mdformat-frontmatter = "^2.1.2"

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.isort]
profile = "black"
line_length = 140
src_paths = ["modules", "tests", "."]

[tool.black]
line-length = 140
target-version = ["py312"]

[tool.pylint.format]
max-line-length = 140

[tool.pytest.ini_options]
norecursedirs = [".git", "__pycache__", "build", "dist", "venv", ".venv"]
addopts = "--verbose"
testpaths = ["tests"]
markers = [
  "physical_hardware: requires a provisioned GPU or physical capture environment",
]

[tool.coverage.run]
source = ["modules", "restore_audio_hybrid"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 90
precision = 2

[tool.coverage.html]
directory = "htmlcov"
