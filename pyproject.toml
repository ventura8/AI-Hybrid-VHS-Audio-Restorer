[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ai-hybrid-vhs-audio-restorer"
version = "1.4.0"
description = "Hybrid AI VHS audio restoration pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]
authors = [{ name = "AI Hybrid VHS Audio Restorer Team" }]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
numpy = "^2.5.3"
scipy = "^1.18.1"
soundfile = "^0.14.0"
pyyaml = "^6.0.3"
tqdm = "^4.70.1"
pyloudnorm = "^0.2.0"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
# All three from the same CUDA index. torchaudio used to come from PyPI, which builds it
# against CUDA 13.0 while torch was pinned to +cu132 -- torchaudio then refuses to import:
#   "PyTorch has CUDA version 13.2 whereas TorchAudio has CUDA version 13.0"
# That killed every mode invoking resemble-enhance (auto, multipass_auto, hybrid) on Linux.
# Windows escaped it only because pip resolves torchaudio to a +cpu build there, whose CUDA
# check is skipped. cu130 is the index that carries a matched set for all three.
#
# The markers keep `poetry lock` to seconds; it used to run for hours (six in CI) and never
# finish. Poetry re-solves the whole graph once per branch of a dependency listed twice, and
# reads `sys_platform` and `platform_system` as unrelated variables. So every split pair here
# (torch, torchvision, torchaudio, audio-separator, onnxruntime) uses `sys_platform`, as
# audio-separator, cuda-toolkit and pandas do, and its two markers are exact complements:
# "linux or win32" for the cu130/GPU builds, "not linux and not win32" (macOS) for PyPI.
# A gap between them (the old "and implementation_name == 'cpython'") adds a third
# "torch not required" branch that resolves PyPI torch 2.14 and a second CUDA stack; a
# `platform_system` marker lets the solver explore platforms no machine reports, such as
# platform_system != "Darwin" with sys_platform == "darwin", where more dependencies split.
torch = [
  { version = "2.14.1+cu130", source = "pytorch-cu130", markers = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { version = "^2.14.1", markers = "sys_platform != 'linux' and sys_platform != 'win32'" },
]
torchvision = [
  { version = "0.29.1+cu130", source = "pytorch-cu130", markers = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { version = "^0.29.1", markers = "sys_platform != 'linux' and sys_platform != 'win32'" },
]
torchaudio = [
  { version = "2.11.0+cu130", source = "pytorch-cu130", markers = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { version = "^2.11.0", markers = "sys_platform != 'linux' and sys_platform != 'win32'" },
]
audio-separator = [
  { version = "^0.47.0", extras = [
    "gpu",
  ], markers = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { version = "^0.47.0", markers = "sys_platform != 'linux' and sys_platform != 'win32'" },
]
onnxruntime-gpu = { version = "~1.31.0", markers = "sys_platform == 'linux' or sys_platform == 'win32'" }
onnxruntime = { version = "^1.31.0", markers = "sys_platform != 'linux' and sys_platform != 'win32'" }
# torch's cuda-toolkit pins these two behind its cublas/nvrtc extras only, while
# nvidia-cudnn-cu13 and nvidia-cublas ask for them unpinned: left alone, the solver's
# leftover branch takes the newest release and the lock carries two of each on Linux.
# They repeat torch's cuda-toolkit pins (13.0.3 for torch 2.13.0+cu130) and change only
# when that cuda-toolkit version does; a stale pin fails `poetry lock` in seconds with a
# message naming the version cuda-toolkit wants. The marker is torch's own
# (`platform_system == "Linux"`); a `sys_platform` marker here leaves never-installed
# phantom entries in the lock.
nvidia-cublas = { version = "13.1.1.3", markers = "platform_system == 'Linux'" }
nvidia-cuda-nvrtc = { version = "13.0.88", markers = "platform_system == 'Linux'" }
librosa = "^1.0.0"
# Output-quality harness (scripts/restoration_quality): ASR consistency and the Audiobox
# Aesthetics predictor. Weights are fetched by scripts/download_quality_models.py.
jiwer = "^4.0.0"
audiobox-aesthetics = "^0.0.4"
# MERT-v1-95M's remote code imports nnAudio only for its CQT front end, which the pinned
# checkpoint has off, so nnAudio is not a dependency.
# Zimtohrli (dsp.zimtohrli_loud), approved 2026-10-08: the PyPI wheel is built by a contributor's
# fork of google/zimtohrli (PyPI attestation), so it is pinned exactly and the reading never
# moves with a new upload; x86-64 only, the platforms with a wheel. Never install upstream's
# pyohrli beside it: both ship the _pyohrli extension.
zimtohrli = { version = "0.2.1.post1", markers = "platform_machine == 'x86_64' or platform_machine == 'AMD64'" }
# silero-vad (the pause VAD, approved 2026-10-08): the base install needs only torch and
# packaging. Never an extra: [all] and [onnx-cpu] pull plain onnxruntime beside onnxruntime-gpu.
silero-vad = "^6.2.3"
# Declared explicitly because audio-separator imports it without declaring it, and
# librosa 1.0 dropped the transitive dependency that used to supply it. Without this the
# next lock regeneration silently removes audioread and every UVR-based mode dies on
# "audio-separator is required for stem separation/denoising".
audioread = "^3.1.0"
fastdtw = "^0.3.4"
transformers = "^5.19.0"
accelerate = "^1.15.0"
omegaconf = "^2.4.0"
rich = "^15.0.0"
loguru = "^0.7.3"
pandas = "^3.0.6"
matplotlib = "^3.11.2"
tabulate = "^0.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
coverage = "^7.16.2"
flake8 = "^7.4.1"
ruff = "^0.16.10"
pylint = "^4.1.2"
radon = "^6.0.1"
mypy = "^2.4.0"
mdformat = "^1.0.0"
pymarkdownlnt = "^0.9.40"
isort = "^9.0.2"
black = "^26.10.0"
taplo = "^0.9.3"
bandit = "^1.9.4"
pip-audit = "^2.10.1"
genbadge = "^1.1.3"
pip = ">=26.2.1"
mdformat-frontmatter = "^2.1.2"
# optuna: the ear v3 settings search baseline (approved 2026-10-08). Never an extra: [document] and
# [optional] pull torch from PyPI beside the cu130 build.
optuna = "^5.0.0"

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.isort]
profile = "black"
line_length = 140
src_paths = ["modules", "tests", "."]

[tool.black]
line-length = 140
target-version = ["py312"]

[tool.pylint.format]
max-line-length = 140

[tool.pytest.ini_options]
norecursedirs = [".git", "__pycache__", "build", "dist", "venv", ".venv"]
addopts = "--verbose"
testpaths = ["tests"]
markers = [
  "physical_hardware: requires a provisioned GPU or physical capture environment",
]

[tool.coverage.run]
source = ["modules", "restore_audio_hybrid"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 90
precision = 2

[tool.coverage.html]
directory = "htmlcov"
