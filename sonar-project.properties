# SonarQube Cloud analysis (sonarcloud.io), run from CI by SonarSource/sonarqube-scan-action.
# The project is bound to the GitHub repository; the token lives in the SONAR_TOKEN secret.
# Automatic Analysis must be off on sonarcloud.io for this project, or the two scans collide.
sonar.projectKey=ventura8_AI-Hybrid-VHS-Audio-Restorer
sonar.organization=ventura8
sonar.projectName=AI Hybrid VHS Audio Restorer
sonar.sourceEncoding=UTF-8

# What is analysed: the application, its scripts and the entry point; the tests separately.
sonar.sources=modules,scripts,restore_audio_hybrid.py
sonar.tests=tests
sonar.python.version=3.12

# Local artefacts, model weights, corpora and generated reports are not code.
sonar.exclusions=**/__pycache__/**,.venv/**,.poetry-venv/**,experiments/**,models/**,artifacts/**,assets/**,docs/**,input/**,output/**,logs/**,scripts/tune_grids/**
sonar.coverage.exclusions=scripts/**,tests/**

# Coverage and test results as the CI test step writes them (pytest-cov XML, pytest JUnit XML).
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

# The quality gate blocks the CI check: the scan step waits for the verdict.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
