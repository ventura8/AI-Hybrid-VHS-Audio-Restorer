# Ear v4 (2026-10-12): critical of hiss. The user's rule (2026-10-11, in capitals): the AI human
# ear must be VERY CRITICAL of VHS hiss under speech or singing and in silence and pauses. The
# user heard hiss on every Tata tape for weeks (the ledger: "underwater again, light hiss (single4s,
# Tele7abc)"; the harness's own round-two note flagged listener.hiss on every v2 plateau while the
# listener heard natural pauses) while the harness never moved: listener.hiss was display-only, pause
# depth ranked a 2.95..35 dB band, gap_atten and gap_hf_excess were shown only, and nothing read
# the hiss under the programme. The same user rejected dead pauses ("silent in pauses"), so "no
# hiss" never means dead air: a quiet floor of room tone mostly under about 2-3 kHz may stay (the pause reading's
# weight is half at 3.15 kHz and applied before its band smoothing: a 2 kHz low-passed room floor reads no hiss).
#
# What v4 changes against v3 (everything after this paragraph is the v3 grid verbatim, its notes
# and sums included, apart from the lines marked v4):
# - Two families, hiss_programme and hiss_pause (scripts/restoration_quality/hiss_programme.py,
#   hiss_pause.py), ranked one-sided: the excess max(0, margin), the margin in dB over the
#   audibility threshold at the critical playback level L_crit = 75 dB SPL (each file's loud
#   frames; hiss_floor.L_CRIT_DB), target 0, dead zone 0, so any audible hiss is charged and none
#   is forgiven. Each place weighs 4.5 (programme: median 3.0, all-band 1.5; pauses: tail 3.0,
#   median 1.5), 9.0 of the 20.5 rank weight (44 %), each hiss entry twice a speech-side one. The
#   programme tail is not ranked: before the window guard its p90 read +19..+28 on SOTI and Vaccin
#   round-one renders, above the sources' median (misaligned windows, not hiss).
# - `tie` (reading units): the p95 of same-percept transforms (a fresh realisation of the same
#   noise, a 0.37-sample delay, +-0.1 dB, a soxr round trip, 16-bit requantisation;
#   python -m scripts.reward_noise_floor --transforms hiss), never a Session 0 benign-pair floor
#   (reward.tie_floors refuses one). The sweep ranks distances in tie buckets
#   (tune_restoration.tie_buckets), reward.py widens the tie band to it, and the loop bands each
#   pair with it (autotune_judging: the band is the larger of the tie and the reading's jitter floor,
#   never a benign-pair floor, and the entry's dead zone stays 0, so the tie forgives once).
# - R4's shape entries (gap_slope_db_oct, gap_spread_db, gap_lsd_db) are display only here (still
#   read and shown, still ranked in tata_v3): their target is the source floor's own shape, so
#   they score a scaled copy of tape hiss as perfect, and their low side charges a pause that keeps
#   room tone and loses hiss, which the user allows (a shaped fill reads slope -16.6 dB/oct, about
#   96 units). Modulation and island kurtosis stay ranked as texture guards.
# - `constraints:` (after `reversals:`): hard guards the loop applies, so the ranking cannot be won
#   by deleting programme or emptying the pauses.
# - Two learned vetoes join: DNSMOS BAK and SIGMOS NOISE (floor multiple 1), vetoes only.
# Why 75 dB SPL (reconciliation probe, D:\ai_restore_work\scratch_hiss\recon): at 65 dB the
# programme reading reproduced none of round one's hiss labels; at 75 it separates them on
# Tele7abc (cathar alpha 2 on 0.7.3 +2.39, its beta 0.005 +2.16, against the cleared 0.7.5 alpha
# 2 -0.70, alpha 2.25 -0.98, baseline -3.01) and orders single4s ("light hiss", +0.01) over
# stitched (-3.01). Validation round 1 (2026-10-12, docs/ear_v4_hiss.md) found the first build's
# programme reading saturating 13-14 dB under the source (a perfect fixture output read +9..+22):
# programme the hiss hid in the source read as hiss. The fixed reading (hiss_programme.py steps
# 3-6) reads a perfect output at or under 0 on 41 of 43 validated linear fixtures and the -30 dB
# oracle within 0.5 dB of its truth. Validation round 2 (the same day) found the half-padded edge
# frames of each window moving the programme margin under a 0.37-sample shift, the ties diluted by
# pooling transforms that barely move a hiss reading, and soft singing in R4's pause mask read as
# pause hiss; the fixed build keeps whole frames only, takes each tie from the widest transform's p95
# and reads the pauses where the source is silent apart from its hiss (hiss_pause.silent_rows). On
# Tele7abc's round one it reads both 0.7.3 alpha 2 renders 2.6-6.7 dB over the cleared ones under
# the programme, all under 0 (the user's blind ABX of 2026-10-09 could not tell 0.7.3 from 0.7.5),
# and in the pauses +1.34 / +0.97 against -2.8 and under: the pause flag fires on both.
# The audibility tie keeps 65 dB and its 24 dB offset. Only a blind
# session at a recorded device and volume moves L_crit. The hiss flags (gates.py,
# listener.hiss_programme / listener.hiss_pause at 0 dB) are the user's rule: no gates file and
# no calibration moves them (gates.USER_RULE_FIXED).
#
# Ear v3 grid for the Tata speech tapes (plan Part 1 / 1.5, design section 5.3, critique fixes).
#
# Every ranked reading is a two-sided distance from what the listener accepted, never a raw
# direction (principle 1): `weight * max(0, |x - target| - dead_zone) / scale`, lower is better,
# so everything inside the dead zone ties. `scripts/tune_restoration.py` ranks these distances
# (weighted mean rank) and `scripts/restoration_quality/reward.py` reads the same entries for
# its per-family win rates (`family` names the family; the worst family decides). Keys are the
# flat aggregates of `runner.aggregates_for_tuning` (metric.side.stat).
#
# Round 0 (2026-10-09, docs/ear_v3_round0.md, "Grid target notes") re-derived every entry the
# notes named, and the slope, on every file the ledger judged; the readings are the aggregate
# medians the grid reads, from experiments/tata_listen/scores_v3/<set>/<tape>.json: r1k
# (r1_known, the known-ordering excerpts), r1l (r1_listen, round one's full tapes), r2 (the v2
# finals) and r3 (v4_air: A air +2 dB, B +1 dB, C off); T / S / V / G are Tele7abc, SOTI,
# Vaccin, Gaudeamus5. Speech-route readings aggregate the speech and mixed windows
# (scorecard.SPEECH_ROUTES), R1 every programme window. The rule for those entries: the dead
# zone admits every judged file the user accepted (ranked first, preferred, cleared, or not
# flagged on that reading's complaint) with a margin of at least one scale unit, rounded up to
# 0.05, and charges a file only where its own flag or the dead-air range puts it.
#
# Calibration v3 re-score (2026-10-10, docs/ear_v3_round0.md, "The grid after calibration v3"):
# scores_v3 now holds Round 0 re-scored with the readings commit 1d644fb fixed; the pre-fix
# reports are kept in experiments/tata_listen/scores_v3_precal. R1, pause depth and the gain
# ride read exactly as before on all 50 speech-tape files. R2 moved on every file it reads (the
# gain is matched around each 's'; the texture needs 30 fricative frames a window, so V and G
# go unread) and R4's shape readings moved on V only (pause bins under the 16-bit dither plus
# 10 dB are left out, pause_metrics.above_dither). An entry was re-derived where a file its
# value was set by moved, or where its old value broke the rule on the new readings: sib_abs
# 3.7 -> 3.4, texture 1.75 -> 2.0, spread 3.0 -> 6.85, LSD 3.5 -> 9.05 and island kurtosis
# 1.8 -> 1.85 (Round 0 had kept it under the one-unit margin); each comment says why. The slope
# (2.1) and modulation (10.0) keep their values: no file they were set by moved and V's moves
# stay inside; each comment names the accepted files it charges or admits by under one unit.
#
# What the rule reaches: every round-two and round-three file. Each scores 0 on these reports,
# so their preferences tie rather than reproduce: S r2 APL over cathar, T r3 B over A and G r3 B
# over A and C, which the grid before Round 0 (8d57030) reproduced (cathar 8.331 against 0; A
# 3.799 against 0; A 6.455 / C 6.558 against B 6.447), are ties here. On round one it does not
# hold, and these entries charge accepted files on purpose: the slope S r1l alpha 2 (preferred);
# pause depth V's ranked-first r1k single4s and stitched and its r1l cathar renders (mixed-route
# aggregate); modulation the r1k cathar075 excerpts (ranked second, T / S / V); texture, pause
# depth and the slope T r1k apl, ranked first on its excerpt, the APL build round one flagged
# ("distortion of spoken 's'", dead air). One known margin exception: modulation admits eight
# accepted files (ranked first, preferred, cleared or not flagged) by under one scale unit, 1.2
# (S r1k stitched and S r1l cathar__baseline 9.866 by 0.134, T r1l cathar075__alpha_2_0 9.863 by
# 0.137, S r1l alpha 2 9.585 by 0.415, T r1l cathar__alpha_2_25 9.489 by 0.511, S r1k single4s
# 9.229 by 0.771, T r1l cathar__baseline / T r1k stitched 9.097 by 0.903); the rule's 14.3 would
# drop cathar075's 2.24 on S r1k, the one charge that orders S's known ranking, and tie it.
# Summed, round one's rankings read: T r1k apl (first) 21.11 (slope 15.40, texture 3.12, depth
# 2.59) above cathar075 (second) 2.56 (modulation), stitched 0 and single4s 12.49 (texture),
# where the grid before Round 0 had 112.12 against 149.43 for apl / cathar075, the right way
# round; V r1k single4s 3.00 and stitched 5.33 (pause depth) above cathar075 2.16 (modulation),
# a verdict this re-derivation newly reverses (r1-vaccin-known-rank, 2 pairs): Round 0's grid on
# the pre-fix reports read 17.76 / 22.21 against 24.68, its spread and LSD charging cathar075
# (9.41 + 13.11) more than the others, and the rule's spread and LSD admit cathar075 (6.072 /
# 8.280), which leaves pause depth's mixed-route aggregate to order the pair. No dead zone under
# the rule restores it (spread cannot charge cathar075, 6.072, without charging the preferred V
# r1l alpha 2, 6.301, more; LSD only between 6.840 and 6.883, charging alpha 2 as well); a
# speech-only pause-depth aggregate would, and tests/unit/test_tune_restoration_v3.py pins the
# reversal until it exists. S r1l alpha 2 6.08 (slope) above apl__baseline 4.56 (depth) and
# cathar__baseline 0; on T r1l the three cathar tiers on top tie at 0 and the roformer renders,
# ranked last, score 8.05 / 8.12 (texture, depth; R4's shape readings are 0), less than the
# other APL renders' 16.12-23.55 (the slope). V r1l alpha 2 (preferred) holds: 3.68 against
# cathar__baseline 5.33 and apl__baseline 10.39. A raw pass-through scores 2.95 (pause depth's
# low edge; every other entry reads an identity as 0), above every round-two and round-three
# file: Session 0's one blind verdict between a restoration and the tape (raw against shipped
# APL, Tele7abc 80 s, APL 3 of 3) holds.
#
# Session 0 (blind, 2026-10-09) told no two restorations apart, the largest difference available
# included, so every verdict below is an unblinded hypothesis and every value here is one too,
# until the listener's blind threshold (the blend continuum) gives "audible" a unit.
#
# `scale` is the reading's benign floor where one was measured (what hiss removal or a fresh
# realisation of the same noise moves it), so a distance counts in floors. The Session 0
# benign-pair floors (experiments/reward/noise_floor_benign.json, pairs nobody told apart) are
# far wider (sib_abs 1.75 dB, pause depth 5.78 dB, presence 0.72 dB) and set no scale yet.
#
# Weights: speech-side readings (timbre, sibilance) 1.5, noise-side 1.0 [S: speculative, the
# P.835 SIG/BAK prior, English population data].
#
# Not ranked here, on purpose (every one is still read and shown in each report):
# - dsp.gap_slope_db_oct, dsp.gap_spread_db, dsp.gap_lsd_db (v4: display only, ranked in tata_v3):
#   they score a scaled copy of tape hiss as perfect and charge a room-tone-only pause;
# - the hiss margins (v4): dsp.hiss_prog_margin_db and dsp.hiss_pause_margin_db feed the flags and
#   the constraints, their excess is ranked; dsp.hiss_prog_removed*_db (physical removal), the
#   all-band and HF margins, the onset, sone and room onset are shown; dsp.hiss_pump_db,
#   hiss_prog_kept_hf_db, hiss_island_kurt and hiss_room_delta_db are constraints;
# - dsp.hf_4k8k / dsp.hf_8k16k: one-sided, they ranked a brighter top better (tata_v2 ranked
#   hf_4k8k "up" while the user heard +2 dB air thin); they stay as backstop gates in gates.py;
# - dsp.residual_noise_db, file.noise_removed_db: more noise removed is shown, never ranked;
# - dsp.lkr: a hard gate (backstop) until R10 reproduces a musical-noise verdict;
# - dsp.gap_pause_s: the seconds of true pause R4 stands on (coverage, shown beside it);
# - dsp.balance_top_db: presence or air, what the bright / dull flags read (gates.py);
# - the sync (file.sync_*): hard gates in gates.py, not a distance;
# - learned judges: vetoes only (below), never in the score;
# - dsp.balance_air_db (dropped, Round 0): R1 air needs a 5292 Hz band, so it is unread on the
#   linear tapes (T / S / G end at 4490 / 5040 / 5040 Hz) and its target came from one Vaccin
#   file; at 0.0 / 0.3 it charged V's ranked-first r1k single4s (-1.476), r1k stitched (-1.114)
#   and r1l alpha 2 (-0.875, preferred). hf_8k16k (paired) and R2 carry the shelf;
# - dsp.sib_centroid_hz (dropped, Round 0): its -600..+300 Hz band admits V's C (+183) and
#   charges V's preferred B (+317), ranking C over B against round three;
# - dsp.gap_atten_db (display only, Round 0): it orders round one backwards. The dead APL renders
#   (T r1l, 34.95-38.45 dB) attenuate less in R4's true pauses than the cleared cathar
#   (42.31-42.84), so any band costs the cleared files more (8.7 / 5.4: 20.9-24.4 against
#   28.2-28.7; Round 0's 14.5 / 11.3: 9.2-12.7 against 16.5-17.0). The pause-attenuation sweep
#   Session 0 planned has not run, so the user's own target is unknown; pause depth below carries
#   dead air. scripts/calibration_ordering.py's default grid leaves it out too
#   (RANKING_EXCLUDED);
# - dsp.gap_hf_excess_db (display only, Round 0; `listen` still picks it): its high side rests on
#   one pair, T 0.7.3 "has hiss" +3.108 against 0.7.5 clean +0.493, which Session 0 did not
#   hear blind (13 of 14 "same" on T and S, ABX 8/16; this reading's benign-pair floor, 4.49 dB,
#   is wider than the pair's 2.6 dB gap). At its old 0 / 2.7 both sides charged accepted files:
#   the low side V r1k cathar075 (-5.165) and S r1l apl__baseline (-6.092) (T r1k cathar075,
#   -2.355, only under Round 0's 0.49 / 1.31), the high side S r1l alpha 2 (+6.494, preferred)
#   and G r2 final2_cathar (+4.662, "pauses natural"). Neither side keeps a verdict.

excerpt_s: 125
margin_s: 5

engines:
  cathar: {process_mode: cathar, suffix: _Cathar_Cleaned}
  apl: {process_mode: auto_pure_linear, suffix: _PureLinear_Cleaned}

gates:
  max_failed_excerpts: 1

ranking:
  # --- timbre (R1, balance_metrics.py): programme-cell balance against the source, target the
  # source itself (0). Benign floor (oracle hiss removal on realistic-v2, p90): tilt 0.02-0.09
  # dB/oct, presence 0.01-0.12, body 0.04-0.10 dB. R1 cannot see the 7.5 kHz shelf where the
  # programme band ends at 4.5 / 5.0 kHz: between r3's A / B / C (+2 / +1 dB / off) presence
  # moves <= 0.051 and tilt <= 0.060 dB/oct on T / S / G (V, whose band reaches 7.1 kHz, 0.044
  # / 0.096).
  # Nothing judged reads above +0.13 (presence, S r1k single4s; tilt +0.099, S r1l
  # apl__baseline), so the bright edges mirror the dull ones until a bright verdict exists.
  # Tilt: the furthest accepted file is V r1k single4s, ranked first, -2.145 dB/oct; 2.25 admits
  # it by 0.105 (T r1k cathar075 -1.122 by 1.128) and charges only the de-esser bugs (-6.054 /
  # -13.250 / -12.374, "under water"). T r1k single4s ("underwater again") reads -1.648, inside.
  dsp.balance_tilt_db_oct.output.median: {target: 0.0, dead_zone: 2.25, scale: 0.1, weight: 1.5, family: timbre}
  # Presence: V r1k single4s -2.108 (ranked first); 2.25 admits it by 0.142 and charges the
  # de-esser bugs (-4.668 / -9.709 / -6.346) by 2.42-7.46. On the all-route aggregate the grid
  # reads, T's "underwater" single4s (-2.039) sits inside V's ranked-first one, so presence cannot
  # carry that verdict (speech windows only: T -2.039, V -1.810); the display `dull` flag does.
  dsp.balance_presence_db.output.median: {target: 0.0, dead_zone: 2.25, scale: 0.1, weight: 1.5, family: timbre}
  # Body: no verdict names it, so no judged file carries a timbre flag on it. The furthest is T
  # r1l apl__roformer (-2.234; the APL renders -2.197..-2.234, flagged on pauses and the 's'
  # only), then T r1k apl -2.160 (ranked first); 2.35 admits them by 0.116 / 0.190 and V r1k
  # single4s (+1.771) by 0.579; nothing judged is charged. v2 finals: APL -0.800 / -0.953 /
  # -0.549, cathar +0.483 / 0.000 / -0.025 (T / S / V).
  dsp.balance_body_db.output.median: {target: 0.0, dead_zone: 2.35, scale: 0.1, weight: 1.5, family: timbre}

  # --- sibilance (R2, sibilance.py): the 's' after R1's gain match, and its texture.
  # Abs level (calibration v3: R1's gain is matched on the programme cells within 0.5 s of each
  # 's'): the accepted files span -3.306 (T r1k cathar075, ranked second) to +2.176 (V r1k
  # single4s, ranked first); 3.4 admits them by 0.094 / 1.224 and charges the de-esser bugs
  # (-21.029 / -17.435 / -22.196, flagged dull). The pre-fix 3.7 was set by V r1k single4s's
  # +3.612, which reads +2.176 now, so the edge comes down to T's cathar075 (pre-fix -3.128); on
  # the new readings 3.7 charged no accepted file either. It does not charge A (r2 final2_apl,
  # "'s' still thin": +0.574 / +0.272 / +0.624 T / S / V, G unread) and ties it with B (r3
  # +0.260 / +0.135 / +0.304): no pooled band separates S's A (r3 +0.275) from V's B (+0.304)
  # (Round 0: +0.273 / +0.319), Session 0 did not hear S's A against B (ABX 10/20), and a band
  # that charged A reversed round two's "APL better than cathar on speech" on T and V
  # (final2_cathar +0.180 / +0.338), which nothing else here charges. Round 0's +0.25 / 0.14 tied
  # S's A with B as well. The thin verdict stays in the paired `thin_abs` display flag and the
  # air reversal below. Benign floor 0.05 dB (hiss removal, sibilance.py). So the sibilance
  # family cannot judge round A1 or A2: r3's A to C spans 0.59 / 0.28 / 0.59 dB on T / S / V,
  # inside this zone, and A2's 's' moves are no larger; it ties every A1 / A2 candidate unless
  # texture crosses 2.0, and both rounds rest on the paired `thin_abs` check, outside the grid.
  dsp.sib_abs_level_db.output.median: {target: 0.0, dead_zone: 3.4, scale: 0.05, weight: 1.5, family: sibilance}
  # Texture (calibration v3: read only on a window with at least 30 fricative frames, so V and G
  # are unread and T and S rank it): round 1 APL renders ("distortion of spoken 's'") read
  # +2.375..+2.420 on T r1l, T's cathar renders +1.184..+1.652; v2 finals and v4_air
  # +0.071..+0.471. The dead zone ends at the midpoint of the accepted top and the APL bottom,
  # 2.014, to the nearest 0.05: 2.0. It admits every accepted file (largest T r1l
  # cathar075__alpha_2_0, ranked first, +1.652, by 0.348; T r1l cathar__baseline / r1k stitched
  # +1.601 by 0.399) and charges the APL renders by 0.375-0.420, T r1k apl (+2.416, the same APL
  # build, ranked first on the known excerpt) by 0.416 and T r1k single4s (+3.665) by 1.665; T
  # r1k deesser_bug (+1.807, flagged dull) sits inside. On the new readings the pre-fix 1.75
  # (the midpoint of +1.343 and +2.122) admits the ranked-first cathar075__alpha_2_0 by 0.098 and
  # the cleared baseline by 0.149, under one scale unit, and charges the deesser bug. Benign
  # floor: static filters < 0.05, hiss removed above the band -0.1..-0.2.
  dsp.sib_texture_db.output.median: {target: 0.0, dead_zone: 2.0, scale: 0.2, weight: 1.5, family: sibilance}

  # --- pauses (pause_metrics.py): how deep the pauses sit, and R4's residual in the true pauses.
  # Pause depth, the output's pause-to-speech depth minus the source's: the band 2.95..35 dB.
  # High edge 35.0, midway between T r1l cathar__baseline (32.975, cleared of dead air) and
  # apl__no_expander (36.888, "silent in pauses"; dead APL 36.888-40.306 on T r1l): it admits the
  # deepest accepted file on T and S, S r1k single4s (33.234, ranked first), by 1.77 and the
  # cleared cathar (T r1l 29.012-32.975) by 2.03 or more, and charges the dead APL by 1.89-5.31
  # and T r1k apl (37.590, the same APL build). Low edge 2.95, one scale unit under the
  # shallowest accepted speech file (S r3 C 3.990, admitted by 1.04; r2 / r3 3.990-13.734): with
  # gap_atten_db display-only, this edge is what keeps a candidate from undoing the denoise. A
  # pass-through reads 0 and is charged 2.95, so the raw tape no longer ties every accepted file
  # (Session 0: raw against shipped APL, APL 3 of 3). The music set's gaudeamus1 final2_apl
  # reads 2.688, but music_v3 does not rank this reading. Scale 1 dB [S]. The 3.9 dB gap the
  # high edge sits in is under this reading's Session 0 benign-pair floor (5.78 dB), and on V,
  # where 47 of 61 windows route mixed, the aggregate puts the ranked-first r1k single4s /
  # stitched and the r1l cathar renders at 38.00-40.33 (speech windows only 28.99-30.42): it
  # charges them (r1l alpha 2, preferred, 38.676, still least of V's three) until a speech-only
  # aggregate exists. Since calibration v3 it alone orders V's known excerpt against the ranking,
  # a reversal the re-derived spread and LSD no longer mask (header): single4s 3.00 and stitched
  # 5.33 against cathar075's 2.16 (modulation).
  dsp.pause_depth_db.delta.median: {target: 18.975, dead_zone: 16.025, scale: 1.0, weight: 1.0, family: pauses}
  # Modulation: v2 finals 3.76-5.97; round 1 clean (0.7.5) 9.9; synthetic islands 12.4, a gated
  # residual 9.8; fresh hiss 1.2. The r1k cathar075 excerpts read 12.590-13.070 (T / S / V, ranked
  # second), outside by 2.59-3.07, and T r1l beta (10.186, hiss) by 0.19. Not re-derived:
  # calibration v3 moved V by 0.124 at most and none of the files above; the rule would put it at
  # 14.3 (T r1k cathar075 by 1.23), where it charges no judged file. A known margin exception
  # (header): 10.0 admits eight accepted files by under one scale unit (1.2): S r1k stitched and S
  # r1l cathar__baseline 9.866 (by 0.134), T r1l cathar075__alpha_2_0 9.863 (0.137, ranked first),
  # S r1l cathar__alpha_2_0 9.585 (0.415, preferred), T r1l cathar__alpha_2_25 9.489 (0.511), S
  # r1k single4s 9.229 (0.771, ranked first), T r1l cathar__baseline / T r1k stitched 9.097
  # (0.903). It stays at 10.0 because 14.3 drops S r1k cathar075's 2.236, the only charge that
  # orders S's known ranking (single4s / stitched 0 against it), so that ranking would tie; V r1k
  # cathar075's 2.158 would go too.
  dsp.gap_mod_dist_db.output.median: {target: 0.0, dead_zone: 10.0, scale: 1.2, weight: 1.0, family: pauses}
  # Island kurtosis: v2 finals +0.04..+0.62; round 1 clean 1.73 / 0.96, hiss 1.75, dead 0.18.
  # Calibration v3 moved V only, inside (r1k cathar075 1.460 -> 1.579, r1l alpha 2 1.102 ->
  # 1.186, final2_cathar 0.519 -> 0.623). Round 0's 1.8 admitted the largest accepted file, T r1l
  # cathar__alpha_2_25 (1.736), by 0.064 and the ranked-first cathar075__alpha_2_0 (1.734) by
  # 0.066, under one scale unit; the rule puts it at 1.85 (by 0.114 / 0.116). The largest judged
  # reading is the 0.7.3 hiss render's 1.754, so 1.85 charges no judged file, as 1.8 did not: it
  # guards against an island residual peakier than every judged file.
  dsp.gap_island_kurt.output.median: {target: 0.0, dead_zone: 1.85, scale: 0.1, weight: 1.0, family: pauses}

  # --- level (R7, file_metrics.gain_ride): p95 |deviation| in LU, never negative, so only the
  # far side of the band can charge. Shown, not flagged, until the loudnorm_ride degradation
  # calibrates it; here only a ride beyond every judged file costs. No judged file carries a level
  # flag; the largest rides are T r1k single4s (2.423, flagged "underwater", a timbre complaint)
  # and V r1k single4s (2.257, ranked first; Round 0: it needs at least 2.26). 2.65 admits them
  # by 0.227 / 0.393 and every judged file. v2 finals 0.225-1.804 LU. Scale [S]. Calibration v3's
  # lag-tracked windows (file_metrics.lag_track) left every judged reading exactly as it was.
  file.gain_ride_lu.output.median: {target: 0.0, dead_zone: 2.65, scale: 0.2, weight: 1.0, family: level}

  # --- v4: hiss under the programme (hiss_programme.py; family hiss_programme). One-sided: the excess is
  # max(0, margin), so target 0 with dead zone 0 charges any audible hiss and never forgives it. tie = p95 of
  # same-percept transforms, never a Session 0 benign-pair floor.
  # Ties from the jitter report of the adversarial review (2026-10-12, re-run on the fixed pause reading and pump;
  # experiments/reward/noise_floor_hiss.json's recipe: the eight pairs of v4_air B_air_1dB and v2 final2_cathar on
  # Tele7abc, SOTI, Vaccin and Gaudeamus5, first 125 s, --transforms hiss, two repeats, dsp; DSP repeat jitter exactly
  # 0): each tie is the report's tie_floor for its flat key, the widest same-percept transform's p95, rounded up to
  # 0.05: programme excess median 0.294 -> 0.30, all-band 0.239 -> 0.25 (as in validation round 2: the programme
  # reading did not change), pause excess tail 0.319 -> 0.35, median 0.331 -> 0.35 (round 2: 0.494 -> 0.50, 0.232 ->
  # 0.25; the 3 dB silent test and the new weight moved the pauses' fresh-draw scatter). The fresh realisations set
  # every one (gain and soxr 0.0001 at most, delay 0.005, requantisation 0.059 on the margin and excess keys). Round 1
  # took the pooled p95 over all eight transforms, which the five that move these readings by about 0 diluted (pause
  # tail 0.17 against a fresh-draw p95 of 0.50-0.80 then), so H1 refused a same-percept redraw.
  dsp.hiss_prog_excess_db.output.median: {target: 0.0, dead_zone: 0.0, scale: 1.0, weight: 3.0, tie: 0.3, family: hiss_programme}
  dsp.hiss_prog_excess_all_db.output.median: {target: 0.0, dead_zone: 0.0, scale: 1.0, weight: 1.5, tie: 0.25, family: hiss_programme}
  # --- v4: hiss in the pauses (hiss_pause.py; family hiss_pause): the hissiest tenth of windows and the median.
  dsp.hiss_pause_excess_db.output.tail: {target: 0.0, dead_zone: 0.0, scale: 1.0, weight: 3.0, tie: 0.35, family: hiss_pause}
  dsp.hiss_pause_excess_db.output.median: {target: 0.0, dead_zone: 0.0, scale: 1.0, weight: 1.5, tie: 0.35, family: hiss_pause}

# The three sections below are the loop's guards (plan 1.5); `scripts/autotune_restoration.py`
# applies them and `tune_restoration.py` reads none of them. A v1 / v2 grid has none, so its
# loop judges as before.
#
# Learned judges are vetoes, never in the score (principle 7; critique 16): a candidate cannot
# win when, on some tape, the median moved the `worse` way from the incumbent's by more than
# `floor_multiple` x its benign floor (`--noise-floors`, the reward_noise_floor report of the
# shipped outputs; default experiments/reward/noise_floor_benign.json), or was lost while the
# incumbent read it (reward.vetoed_readings, then reward.gate_constraints(learned_veto=...)).
# Tails are never read. A veto with no floor in the report stops the loop before it renders:
# without the report this grid does not run, and the report reads only the families it was
# run with (--families speech,mos here; the default is dsp only). A floor of 0 stops it the
# same way, named with the reading: CER read at --repeats 1 can have a p95 deviation of
# exactly 0, and a limit of 0 would veto any move the worse way, Whisper's own jitter
# included. Measure with --repeats 2 or more, or with resample_roundtrip in --transforms.
# Floors and multiple (2026-10-09): the default report is experiments/reward/
# noise_floor_benign.json, the deviation between pairs of restorations the listener could not
# tell apart blind in Session 0 (`reward_noise_floor.py --benign-pair`; CER 0.038, speaker cos
# 0.0063, UTMOS 0.051, SCOREQ 0.136, SIGMOS COL 0.226 / DISC 0.153). The near-copy report
# (noise_floor.json: CER 0.0008, speaker cos 1e-5) made every veto refuse moves on jitter. A
# benign-pair floor already marks what was not heard, so the multiple is 1, not 3: at 3 the CER
# limit would let an 11-point intelligibility drop through.
vetoes:
  speech.cer.output.median: {worse: up, floor_multiple: 1}
  speech.speaker_cos.output.median: {worse: down, floor_multiple: 1}
  speech.utmos.delta.median: {worse: down, floor_multiple: 1}
  mos.scoreq_nr.delta.median: {worse: down, floor_multiple: 1}
  mos.sigmos_col.delta.median: {worse: down, floor_multiple: 1}
  mos.sigmos_disc.delta.median: {worse: down, floor_multiple: 1}
  # v4: the learned noise judges veto only, never in the score (multiple 1). They are hiss readings, so the loop
  # measures them in their jitter floor (--jitter-floors: 0.0034 / 0.114 on noise_floor.json), never in the benign-pair
  # floors (0.1205 / 0.1165): autotune_judging.veto_floors, the hiss exemption.
  mos.dnsmos_bak.delta.median: {worse: down, floor_multiple: 1}
  mos.sigmos_noise.delta.median: {worse: down, floor_multiple: 1}

# The verdict-reversal guard: a ledger boundary per entry (assets/quality_calibration/
# verdicts.jsonl). A move that heads the rejected way and ends at the value or past it is
# refused before it is rendered (reward.reversals_refusing); a move back is never refused.
reversals:
  # Round 3 (2026-10-08), every tape: air +1 dB over +2 dB and off (the 's' less thin).
  - {key: linear_air_gain_db, rejected_above: 2.0, verdict: r3-air-preference}

# v4: hard guards (autotune_guards.mark_constraints; reward.Constraint): a candidate whose reading, on some tape, is
# worse than the incumbent's by more than max_move (default 0) and lies beyond bound (default: none) is excluded, and
# so is one worse than the incumbent's and more than max_move past the bound: past it the limit does not follow the
# incumbent, or a loop could creep max_move further every accepted round (adversarial review, 2026-10-12).
# A reading the incumbent has and the candidate lost excludes too. They keep "no hiss" from being won by
# deleting programme or emptying the pauses. Each value names its evidence.
constraints:
  # H1: no new audible hiss over the incumbent beyond jitter (fill 8 against the shipped 12 on Tele7abc: programme
  # +11.7 against +6.4 and pause tail +32.4 against +29.9, refused; fill 18, +3.2 / +23.7, allowed). max_move = the
  # entry's tie (jitter report). SOTI's cathar alpha 2.0 ("alpha 2 sounds better", round one, before the rule) reads
  # its pause tail at -0.39 against the baseline's -6.01, both excess 0; Vaccin's excess rises 0.14 (+0.85 against
  # +0.71), within the tie. Tele7abc's alpha 2.0 on cathar 0.7.3 and its beta 0.005 ("has hiss", round one) trip it
  # (1.34 / 0.98), the cleared renders do not (docs/ear_v4_hiss.md).
  dsp.hiss_prog_excess_db.output.median: {worse: up, max_move: 0.3}
  dsp.hiss_pause_excess_db.output.tail: {worse: up, max_move: 0.35}
  # H2: never hissier than the raw tape; bound = the delta key's own tie floor rounded up to 0.05
  # (programme 0.327 -> 0.35, pause tail 0.319 -> 0.35).
  dsp.hiss_prog_margin_db.delta.median: {worse: up, bound: 0.35}
  dsp.hiss_pause_margin_db.delta.tail: {worse: up, bound: 0.35}
  # G1 dead air on speech windows (round-one dead APL 36.89-37.22, roformer 40.3; cleared cathar 29.0-33.0).
  dsp.pause_depth_speech_db.delta.median: {worse: up, bound: 35.0}
  # G2 room band emptied to digital silence (APL keeper off on Tele7abc -62.2; shaped fill -5.8..-9.5).
  dsp.hiss_room_delta_db.output.median: {worse: down, bound: -54.0}
  # Gated hiss: pauses emptied while the hiss stays under speech. The pump takes medians over the pause frames
  # (adversarial review, 2026-10-12): with means a gate's straddling edge frames carried it, and Tele7abc's true pauses
  # gated 20 / 30 / 40 / 50 dB read +8.2 / +11.2 / +11.5 / +11.5, under the bound at every depth; now +11.8 / +21.8 /
  # +31.8 / +41.8 (SOTI's 20 / 30 dB +11.6 / +21.6). Bound 12.0: midway between the round-one renders the user did not
  # call dead (T r1l cathar, at most +6.49, beta 0.005; cleared cathar075 alpha 2 +2.93, alpha 2 +4.88; known cathar075
  # +6.29) and the dead APL (+18.09..+19.40; roformer +95), 12.29, rounded down. A 20 dB pause gate still leaves
  # audible hiss in the pauses (T pause tail +10.1) and passes; 30 dB does not. v2 finals -3.4..-11.2, fill 8 / 12 /
  # 18 -11.5..-1.2, cathar keeper off +1.2..+3.4, APL keeper off +72..+89. Vaccin's programme windows hold no 0.5 s of
  # pause over the dither: its pump reads None, the other tapes carry it.
  dsp.hiss_pump_db.output.median: {worse: up, max_move: 3.0, bound: 12.0}
  # Dulling inside the bands the hiss reading rewards: the mean over bands of 3 kHz and up of each band's median
  # (jitter p95 0.005; a 4 kHz low pass -4.4..-10.5 and a -6 dB cut of 4-6 kHz -1.9..-2.9 on the linear fixtures).
  # Bound -6.0 (adversarial review: with max_move alone the loop could dull 1 dB more on every accepted round): it
  # admits every judged file the user did not call dull (lowest S single4s -5.60, ranked first; S stitched -5.51) and,
  # with the max_move allowance past it, holds the floor at -7.0, over T single4s (-7.04, "underwater again").
  dsp.hiss_prog_kept_hf_db.output.median: {worse: down, max_move: 1.0, bound: -6.0}
  # Musical noise under the programme (islands +0.55..+0.71) and in the pauses (R4 texture). The pause islands also need
  # tata_v3's dead-zone edge, 1.85 (the largest judged reading is 1.754): with max_move alone the cleared round-one cathar
  # renders (cathar075 alpha 2 1.734, alpha 2.25 1.736 against the baseline's 0.959, T r1l) were excluded, which the
  # acceptance (dead air excluded, the cleared renders not) forbids. The benign floor of hiss_island_kurt is 0.015
  # (calibration en / fr; 0.22 before validation round 1 drew the fresh hiss exactly) and its tape jitter p95 0.028
  # (requantisation at most 0.161): this 0.3 sits well above both. Its bound 2.0 (adversarial review: with max_move
  # alone islands could grow 0.3 on every accepted round) is the v3 rule's: the largest judged reading, 1.87 (T stitched
  # and T r1l cathar__baseline, accepted), plus one 0.1 unit, rounded up to 0.05; no judged file reaches it.
  dsp.hiss_island_kurt.output.median: {worse: up, max_move: 0.3, bound: 2.0}
  dsp.gap_island_kurt.output.median: {worse: up, max_move: 0.3, bound: 1.85}
  dsp.gap_mod_dist_db.output.median: {worse: up, max_move: 1.2}
  # Timbre and the 's' may not be traded for hiss: R1 presence/air (2 x its 0.12 benign floor) and the v3 dead-zone
  # edges on the dull side as hard limits. balance_top also needs the dull flag's edge, -1.0 dB: cathar075 alpha 2 (cleared,
  # T r1l) reads -0.963 against the baseline's -0.231 and was excluded by the move alone.
  dsp.balance_top_db.output.median: {worse: down, max_move: 0.25, bound: -1.0}
  dsp.balance_tilt_db_oct.output.median: {worse: down, bound: -2.25}
  dsp.balance_presence_db.output.median: {worse: down, bound: -2.25}
  dsp.sib_abs_level_db.output.median: {worse: down, bound: -3.4}
  dsp.sib_texture_db.output.median: {worse: up, bound: 2.0}

# The audibility tie (principle 6): a candidate auditory.compare_files cannot tell from the
# incumbent on any tape is a tie, never scored and never accepted. offset_db is the masked
# threshold's offset under the spread excitation (auditory.MASKING_OFFSET_DB, calibrated
# 2026-10-09: air +1 vs +2 dB audible on every tape, the v3 sibilance final vs v2 inaudible).
audibility: {offset_db: 24.0}

variants:
  cathar:
    baseline: {}
  apl:
    baseline: {}
