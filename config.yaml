# ==============================================================================
# AI Hybrid VHS Audio Restorer - System Configuration
# ==============================================================================
# This configuration file controls the global parameters for the audio restoration
# pipeline. Modifying these values allows you to fine-tune the mixing levels,
# file scanning behavior, and other runtime settings without altering the codebase.
#
# USAGE NOTE:
# - Changes require a restart of the application to take effect.
# - Ensure strict indentation is maintained (YAML standard).
# ==============================================================================

# ------------------------------------------------------------------------------
# Audio Mix Levels
# ------------------------------------------------------------------------------
# These parameters control the relative volume of the separated stems in the
# final stereo mix. The restoration pipeline separates audio into 'Vocals' and
# 'Instrumental' (Music) tracks, enhances them individually, and then recombines
# them.
#
# Type: Float
# Range: 0.0 to Infinity
#   - 0.0 : Mutes the stem completely.
#   - 1.0 : Retains the original volume level of the extracted stem (Default).
#   - >1.0: Boosts the volume (e.g., 1.2 = +20% volume).
#
# Recommendation:
# Keep at 1.0 for a neutral restoration. Adjust 'vocal_mix_volume' to 1.1 or 1.2
# if the vocals in your source VHS footage are buried or muddy.
# ------------------------------------------------------------------------------
vocal_mix_volume: 1.0
background_mix_volume: 1.0

# ------------------------------------------------------------------------------
# AI Model Selection
# ------------------------------------------------------------------------------
# Specify the filenames of the AI models used for separation and denoising.
# Models required for 'hybrid' and 'denoise_only' modes are automatically
# downloaded and cached by 'audio-separator' upon first execution.
#
# Model Breakdown & Selection Guide:
# 
# 1. Vocals Models (for extracting dialogue/speech and singing):
#    - model_bs_roformer_ep_317_sdr_12.9755.ckpt
#      * Architecture: Band-Split RoFormer (Transformer)
#      * Best for: Maximum separation precision, clearest dialogue extraction.
#      * Performance: High VRAM requirement (Recommended >= 8 GB VRAM).
#    - UVR-MDX-NET-Voc_FT.onnx
#      * Architecture: MDX-Net Fine-Tuned (ONNX)
#      * Best for: Ultra-fast separation, lower VRAM footprints, high quality.
#    - kim_vocal_2.onnx
#      * Architecture: MDX-Net
#      * Best for: Vintage recording styles and challenging vocal frequencies.
#
# 2. Instrumental Models (for isolating ambient background and music):
#    - UVR-MDX-NET-Inst_HQ_3.onnx
#      * Architecture: MDX-Net HQ
#      * Best for: High-fidelity background stem isolation with minimal vocal bleed.
#    - UVR-MDX-NET-Inst_Main.onnx
#      * Architecture: MDX-Net
#      * Best for: General-purpose background separation.
#    - UVR_MDXNET_KARA_2.onnx
#      * Architecture: MDX-Net Karaoke
#      * Best for: Aggressive vocal removal from background music tracks.
#
# 3. Denoise Models (AI broadband tape noise and hiss removal):
#    - UVR-DeNoise-Lite.pth
#      * Best for: Transparent denoising. Preserves delicate high-frequency room
#        ambiance and consonant air while eliminating broadband analog tape hiss.
#    - UVR-DeNoise.pth
#      * Best for: Heavy noise reduction on severely degraded analog tapes.
#        May attenuate subtle environmental background sounds.
#    Model names must be bare filenames inside models/; a path is ignored and the
#    default is used.
# ------------------------------------------------------------------------------
vocals_model: "model_bs_roformer_ep_317_sdr_12.9755.ckpt"
background_model: "UVR-MDX-NET-Inst_HQ_3.onnx"
denoise_model: "UVR-DeNoise-Lite.pth"
adaptive_denoise_threshold_db: -50.0

# neural_chunk_seconds:
#   - The longest track the neural denoiser (UVR, or the Mel-RoFormer that
#     apl_neural_model names) processes in one pass, in seconds.
#   - The UVR separator keeps several full-length copies of the track in memory after
#     inference, about 30 GB per hour of audio, so a long capture fails outright:
#     3h00m runs out of memory on a 62 GB machine. The RoFormer's memory per hour has
#     never been measured; it is sized by the same figure. A track longer than this
#     value is cut into equal chunks no longer than it, each overlapping the next by
#     two seconds, denoised one at a time and rejoined with a crossfade; the result is
#     the whole-track result to within float rounding, on each model's own grid (see
#     docs/configuration.md, "Long Captures").
#   - Default: 0, which sizes the chunk from the machine: half its memory at that
#     rate, between five minutes and two hours (57 minutes on a 62 GB desktop,
#     28 on a 30 GB laptop). Tracks up to the chunk length are processed whole. Set
#     a value to fix the length, for example 3600; a value longer than any capture
#     you have, such as 86400, keeps every track whole at the cost of memory.
neural_chunk_seconds: 0

# ------------------------------------------------------------------------------
# Enhancement Settings (Resemble-Enhance)
# ------------------------------------------------------------------------------
# Controls the quality and behavior of the vocal enhancement stage.
#
# enhance_nfe (Number of Function Evaluations):
#   - Type: Integer
#   - Supported range: 1 to 128
#   - Min behavior (1): Absolute minimum evaluations, fastest processing with coarse synthesis.
#   - Values below 32: Aggressive speed optimization trading off neural detail and synthesis quality.
#   - Baseline quality (32): Fast processing, but more artifacts and less detail than 128.
#   - Max behavior (128): Best detail/cleanup quality, but slower processing.
#   - Practical default: 128 (quality/speed balance).
#
# enhance_tau (Temperature/Scale):
#   - Type: Float
#   - Suggested range: 0.1 to 0.7
#   - Min behavior (0.1): Conservative/safer enhancement, preserves more original tone,
#                         but removes less noise.
#   - Max behavior (0.7): More aggressive enhancement/noise suppression, but can sound
#                         over-processed or less natural.
#   - Practical default: 0.3 (balanced for this project).
# ------------------------------------------------------------------------------
enhance_nfe: 128
enhance_tau: 0.3

# ------------------------------------------------------------------------------
# Synchronization Settings
# ------------------------------------------------------------------------------
# Controls how the processed audio stems are aligned with the original source.
#
# sync_method:
#   - Type: String
#   - Allowed values: 'shift' or 'dtw'
#   - Min behavior ('shift'): Fastest, applies one global offset correction;
#                             best when drift is small/constant.
#   - Max behavior ('dtw'): Most adaptive, corrects variable drift/wow/flutter;
#                           slower and more compute-heavy.
#   - Practical default: 'shift' (good quality/speed balance).
#
# dtw_resolution:
#   - Type: Integer (Hz)
#   - Suggested range: 25 to 100
#   - Min behavior (25 Hz): Faster processing, lower timing precision (~40ms).
#   - Max behavior (100 Hz): Highest timing precision (~10ms), slower processing.
#   - Practical default: 25 (faster); use 50 for better precision in drift-heavy audio.
#
# sync_dtw_enable:
#   - Type: Boolean
#   - true (default): a tape the scanner reads as drifting (has_drift) takes DTW
#     sync, as every release has run.
#   - false: auto_pure_linear (its stem path too), cathar and every single-track
#     mode take shift sync instead, whatever the scanner or sync_method says. Their
#     chains keep the source's length and time base, so a warp can only add error:
#     the DTW path plays whole 40 ms frames at 0x or 2x. On the IA hunt's stored
#     outputs (2026-10-12) 24 of 30 cathar and 15 of 30 auto_pure_linear outputs
#     sent to DTW carry frozen holds, none of the 205 per engine sent to shift.
#     The stem modes (hybrid, multipass_auto, auto_pure) keep DTW. Not yet heard
#     by a listener, so the default keeps every output's bytes.
# ------------------------------------------------------------------------------
sync_method: "shift"
dtw_resolution: 25
sync_dtw_enable: true

# ------------------------------------------------------------------------------
# Processing Mode & Multi-Pass Cascaded Engine
# ------------------------------------------------------------------------------
# Controls the complexity and engine of the restoration pipeline.
#
# enable_multipass (Multi-Pass Cascaded Pipeline Toggle):
#   - Kept for compatibility and no longer read. It used to send 'auto' to the 4-pass
#     'multipass_auto' engine on dialogue; that engine measured 0.11 dB of noise removed on
#     real tape against 10.10 for 'auto_pure_linear', so 'auto' no longer runs it. Set
#     process_mode to 'multipass_auto' to run the 4-pass engine explicitly.
#
# process_mode:
#   - 'auto_pure_linear'   : Full-Mix Pure Speech & Ambient Denoising Engine (*_PureLinear_Cleaned).
#                            Dual-resolution scan, analog pre-conditioning, gated physical repair, hum
#                            cancellation, plosive control, noise-profile subtraction and UVR-DeNoise.
#   - 'auto_pure'          : Multi-Step Pure Speech & Ambient Denoising Engine (*_Pure_Cleaned).
#                            Denoises voice without generative AI vocoder synthesis while cleanly
#                            conserving and denoising original music and ambient acoustics.
#   - 'auto'               : AI Auto-Detection & Restoration Engine (*_Auto_Cleaned). (Default) Profiles the
#                            tape (speech, music, rhythm, tonality, noise floor, hum) and runs
#                            'auto_pure_linear', which leads 'cathar' on every class measured on
#                            real tape; runs 'cathar' on sustained tonal programme with no silence
#                            for the noise probe to learn from, where cathar deviates less for
#                            2-3 dB less removal ('auto_cathar_tonal', false keeps 'auto_pure_linear'
#                            there), and when the neural denoiser is not installed; cathar only when
#                            it is installed, and 'auto_ffmpeg_native' when neither engine is.
#   - 'multipass_auto'     : Explicit 4-Pass Cascaded AI & DSP Restoration Engine (*_MultiPass_Cleaned).
#   - 'multipass'          : Compatibility alias for 'multipass_auto'.
#   - 'hybrid'             : Full AI separation + vocal enhance + background denoise.
#   - 'denoise_only'       : Denoise full audio + Sync via AI (UVR-DeNoise-Lite).
#                            Preserves original mix balance.
#   - 'auto_ffmpeg_native' : Intelligent adaptive FFmpeg DSP restoration. Scans audio for mechanical
#                            motor rumble, 50/60 Hz hum/buzz, click density, and tape hiss noise floor,
#                            auto-tuning filter graphs for pristine studio-quality restoration.
#   - 'ffmpeg_native'      : Ultra-fast native FFmpeg DSP restoration (afftdn + adeclick + highpass).
#                            Best for tape hiss, mechanical rumble, and electrical clicks without GPU.
#   - 'arnndn_speech'      : FFmpeg Recurrent Neural Network (RNNoise) speech denoiser.
#                            Best for VHS recordings containing dialogue and spoken voice.
#   - 'cathar'             : Pure-Rust Audio Restoration Engine (*_Cathar_Cleaned).
#                            Specialized multi-stage DSP for VHS: dewind, azimuth, declick,
#                            decrackle, declip, adaptive dehum, dewow, and phase-coherent denoise.
#   - 'cathar_vhs'         : Compatibility alias for 'cathar'.
# ------------------------------------------------------------------------------
process_mode: "auto"
enable_multipass: true
# Files restored at the same time when a folder or several files are given. cathar is
# single-threaded and its stages run one after another (measured on a 134 s tape: the
# SBR enhance stage 12 s of CPU for 12 s of wall, the same with RAYON_NUM_THREADS set),
# so more cores only help through more files at once; each file runs in its own
# interpreter with its own work directory and its output is bit-identical to a solo
# run. 1 keeps the sequential batch. Neural modes load their models once per job
# (about 6 GB of GPU memory each for auto_pure_linear): 8 suits cathar on a 32-core
# machine; use 2-4 for the neural modes.
batch_jobs: 8

# ------------------------------------------------------------------------------
# Native FFmpeg Filter Settings (for 'vhs_native' mode; 'ffmpeg_native' alias)
# ------------------------------------------------------------------------------
# Fine-tune native DSP filters built into FFmpeg for VHS tape artifacts.
#
# afftdn_nr (Noise Reduction dB):
#   - Type: Float
#   - Suggested range: 8.0 to 15.0 dB (Default: 10.0)
#   - Recommendation: Avoid values >18 dB to prevent metallic chirping or phase artifacts.
#   - Empirical multi-pass finding (26 tape-passes): 10.0 dB reduces over-processing
#     on cleaner tapes while preserving dialogue transients and dynamic range.
#
# afftdn_nf (Noise Floor dB):
#   - Type: Float
#   - Suggested range: -80.0 to -20.0 dB (Default: -55.0)
#   - Empirical multi-pass finding (26 tape-passes): -55.0 dB provides transparent
#     tracking baseline across diverse VHS captures (NF -20 to -59 dB).
#
# afftdn_tn (Continuous Noise Tracking):
#   - Type: Boolean
#   - Default: true (Enables continuous adaptive estimation across tape dynamics)
#
# highpass_freq (Mechanical Rumble Cutoff in Hz):
#   - Type: Integer
#   - Default: 80 (Empirical: rumble detected at 45–75 Hz across 4/21 tapes;
#     80 Hz safely eliminates all observed rumble including the 75 Hz case
#     without impacting programme bass content above 80 Hz)
#
# enable_adeclick (Impulsive Click/Pop Interpolation):
#   - Type: Boolean
#   - Default: true (Empirical: click_density_high=true in ALL 21 tested tapes)
#
# notch_freq (mains-hum notch filter in Hz):
#   - Type: Float
#   - Default: 50.0 (Empirical: 50 Hz PAL mains hum detected in 13/21 tapes;
#     100 Hz 2nd harmonic auto-detected separately by auto_ffmpeg_native scan;
#     set to 60.0 for NTSC captures, 0.0 to disable entirely)
#
# azimuth_reject_inverted_pair (the scanner's azimuth reading, which the analog
# pre-conditioning of every mode, cathar included, applies as a delay):
#   - A pair whose channels correlate negatively (r <= -0.3) carries one channel with
#     its polarity inverted. The azimuth gate reads |r|, so such a pair passes it and
#     the lag it reads is not a skew: on L/-L pairs a 1 kHz tone reads -0.50 ms and a
#     2 kHz tone -0.25 ms, which the pre-conditioning would apply as a delay. The scan
#     always logs such a pair.
#   - false (Default): the skew is read as before, so every output keeps its bytes.
#   - true: no azimuth skew is read from an inverted pair.
# ------------------------------------------------------------------------------
afftdn_nr: 10.0
afftdn_nf: -55.0
afftdn_tn: true
highpass_freq: 80
enable_adeclick: true
notch_freq: 50.0
azimuth_reject_inverted_pair: false

# ------------------------------------------------------------------------------
# ARNNDN Speech Settings (for 'arnndn_speech' mode)
# ------------------------------------------------------------------------------
# Controls the FFmpeg Recurrent Neural Network (RNNoise) speech denoiser.
# The application automatically downloads the specified model into 'models/arnndn/'
# if it is not already present locally on your system.
#
# arnndn_model:
#   - "cb.rnnn"         : Standard balanced speech model trained on diverse noise profiles (Default).
#   - "bd.rnnn"         : Optimized for clear studio/broadcast dialogue captures with background noise.
#   - "lq.rnnn"         : Upstream general-purpose model for speech with varied noise.
#   - "mp.rnnn"         : Tuned for mixed speech and medium persistent background interference.
#   - "sh.rnnn"         : Specialized model for aggressive high-frequency hiss attenuation.
#                         (Recommended for tapes with NF > -40 dB and high hiss content)
#
# Custom Models:
#   You can also specify custom model filenames placed inside 'models/arnndn/' or 'models/'.
#
# arnndn_highpass_freq:
#   - Cuts sub-audible mechanical rumble before neural inference (Default: 80 Hz)
#   - Empirical finding: rumble at 45–75 Hz across 4/21 tapes; 80 Hz safely
#     clears all observed rumble without attenuating programme bass.
#
# arnndn_enable_adeclick:
#   - Cleans impulsive clicks before neural inference (Default: true)
#   - Empirical finding: ALL 21 tested tapes show click_density_high=true;
#     pre-click removal prevents ARNNDN from treating impulsive artifacts as
#     speech transients and smearing them into the output.
# ------------------------------------------------------------------------------
arnndn_model: "cb.rnnn"
arnndn_highpass_freq: 80
arnndn_enable_adeclick: true

# ------------------------------------------------------------------------------
# Cathar Restoration Settings (for 'cathar' mode)
# ------------------------------------------------------------------------------
# Controls the pure-Rust Cathar audio restoration engine tailored for VHS captures.
# Provides transparent, non-neural DSP filtering without hallucination.
#
# cathar_denoise_method:
#   - Allowed values: 'spectral' (spectral subtraction) or 'wiener' (Wiener filter)
#   - Default: 'spectral'
#
# cathar_alpha:
#   - Noise subtraction aggressiveness factor (suggested: 1.0 to 6.0, default: 2.0)
#   - Empirical tuning: reduced from 3.0 to 2.5 for more transparent restoration
#     on cleaner tapes (NF < -50 dB); prevents musical noise artifacts without
#     sacrificing effective hiss removal on noisier captures.
#   - 2.0 (from 2.5) on the output-quality harness over 13 excerpts of five real
#     tapes (docs/validation.md): SIGMOS colouration +0.125 against +0.062,
#     discontinuity tail -0.34 against -0.42, Whisper CER 0.058 against 0.093,
#     Audiobox PQ -0.11 against -0.35, 4-8 kHz on loud frames -2.5 dB against
#     -3.0, for 1.6 dB less noise removed (11.4 against 13.1); chosen by ear on
#     the same tapes. 3.5 and the Wiener filter lose every listener-side reading.
#   - 1.0 (from 2.0) is the listener round's plateau (2026-09-25, cathar 0.7.6):
#     the self-driving loop on the four full Tata tapes took 2.0 to 1.5 judging on
#     the v1 harness, then to 1.0 judging on the listener readings (gap air, pause
#     depth, sibilance), each move ahead on at least three of the four tapes. The
#     same plateau set cathar_beta 0.02, cathar_repair_strength 2, the coherent
#     path and the SBR enhance off on speech, cathar_noiseprint_duration_s 4.5 and
#     cathar_deesser_threshold 12 (listed beside each key below). The plateau is
#     the harness's; the listening round on
#     D:\Tata\New folder\variants\v2 is what confirms or overrides it.
#
# cathar_music_profile / cathar_music_persistence_min / cathar_music_alpha /
# cathar_music_enable_noiseprint / cathar_music_enable_coherent /
# cathar_music_enable_deplosive / cathar_music_enable_deesser /
# cathar_music_expander_depth_db / cathar_music_crt_notch_q:
#   - The settings a music tape gets instead of cathar_alpha, cathar_enable_noiseprint,
#     cathar_enable_coherent, cathar_enable_deplosive, cathar_enable_deesser,
#     expander_depth_db and crt_notch_q. The speech settings shave
#     music: a print learned from music is programme, and subtracting it at the speech
#     factor takes 8-16 kHz down 14 dB and removes no noise. The self-driving loop on
#     11 Internet Archive music clips and the first minute of Gaudeamus settled, over
#     five rounds, on subtraction at 0.5 with no learned print, the coherent path off
#     and the deplosive off: 22 hard-gate failures against 28 at the speech settings,
#     ahead on 6-10 of 12 clips in every accepted round (docs/validation.md).
#   - The listener round (2026-09-25, four rounds on the same 12 clips, hard-gate
#     failures 31 -> 27) then switched the de-esser off and the coherent path on,
#     narrowed the CRT notch to Q 60 and set the polish expander to 4 dB on music,
#     each accepted on 8-9 of 12 clips.
#   - A tape is music when the scanner's tonal persistence (the median share of held
#     spectral peaks over 15 s windows; the band ratios read every music clip as
#     dialogue) is at least cathar_music_persistence_min: music clips read 0.064-0.225,
#     speech over a music bed 0.007-0.033, dry dialogue under 0.003, so 0.05 sits in
#     the gap. cathar_music_profile false gives every tape the speech settings.
#
# cathar_music_beta / cathar_music_enable_repair / cathar_music_dewind_cutoff:
#   - The music profile's subtraction floor, transient spike repair switch and dewind
#     cutoff, in place of cathar_beta, cathar_enable_repair and cathar_dewind_cutoff on a
#     tape the profile takes. Until 2026-10-09 music ran the speech keys, so 0.02, true
#     and 80 keep every music output's bytes. Round C3 (music profile) searches them;
#     none is judged by ear yet.
#   - A cathar tape is high-passed twice: the pre-conditioning graph's highpass at the
#     scanner's rumble pick (0 / 45 / 60 / 75 Hz, 80 when the scan fails), then cathar's
#     dewind, a high-pass at its cutoff (80, the higher of the two). The music cutoff
#     replaces the dewind's only; a tape the scanner cut at 60 or 75 Hz keeps that cut.
#
# cathar_beta:
#   - Spectral floor to prevent musical noise artifacts (suggested: 0.005 to 0.05, default: 0.01)
#
# cathar_enable_coherent:
#   - Phase-coherent stereo processing (default: true)
#
# cathar_enable_dewind:
#   - Sub-audible mechanical rumble filter (default: true, cutoff 80 Hz)
#   - Empirical: rumble at 45–75 Hz; 80 Hz cutoff clears all observed cases.
#
# cathar_enable_azimuth:
#   - Inter-channel phase delay correction (default: true)
#
# cathar_enable_declick:
#   - Impulse click / head-switching dropout repair (default: true)
#
# cathar_declick_threshold:
#   - Empirical tuning: lowered from 10.0 to 8.0 — all 21 tapes show high click
#     density; lower threshold catches subtler head-switching dropouts.
#
# cathar_enable_decrackle:
#   - Tape surface crackle repair (default: true)
#
# cathar_decrackle_sensitivity:
#   - Empirical tuning: raised from 5 to 6 — ubiquitous high click density
#     across all 21 tapes warrants slightly higher crackle sensitivity.
#
# cathar_enable_declip:
#   - Analog saturation / preamp de-clipping (default: true)
#
# cathar_declip_mode (round C4):
#   - 'always' (Default): declip runs on every tape, as every release has.
#   - 'detected': declip runs only on a tape the scanner flagged as clipped
#     (profile.has_clipping_any_channel: 20 or more samples at |x| >= 0.985
#     counted over every channel of the minutes the scan reads, the first 60 s of
#     a tape under 4 min or four spread 60 s blocks of a longer one). Counted per
#     channel, not in the mono mix: a tape with one dead channel (half the 21-tape
#     library) has its live side halved by the mix, which then never reaches
#     0.985, while the pre-conditioning mirrors that side to full scale before
#     cathar runs. The mono-mix verdict (profile.has_clipping) still switches the
#     pre-conditioning adeclip and auto_pure_linear's own declip, unchanged. A
#     scan that left no verdict (unreadable audio, so the scanner's fallback
#     strategy; a caller with no strategy) runs declip as on 'always' and logs a
#     WARNING. Clipping outside the scanned minutes can go unflagged.
#   - cathar 0.8.0's declip gave a synthetic file peaking at 0.5 back sample for
#     sample and reshaped every sample over cathar_declip_threshold (0.95) on
#     unclipped files peaking at 0.97 and 1.0, so the modes differ on tapes with
#     peaks over 0.95 that the scanner does not flag; 'detected' also saves the
#     stage's runtime (5.29 s on an 8 s fixture). Not judged by ear yet: the C3
#     listening session decides.
#
# cathar_enable_dehum:
#   - Adaptive mains buzz filter (default: true)
#
# cathar_dehum_freq (round C4):
#   - 'scanner' (Default): dehum --freq takes the scanner's mains family (notch_hz
#     50 or 100 -> 50, 60 or 120 -> 60; notch_freq when the strategy carries no
#     reading) and no dehum runs on a tape the scan read as hum-free, as every
#     release has. The scanner votes on the first 32768 samples (about 0.7 s).
#   - 0: dehum --freq 0 on every tape: cathar 0.8.0 detects the family from the
#     recording itself. With cathar_dehum_adaptive (true) the tracker also picks
#     50 vs 60 and passes a file without hum through unchanged (synthetic files:
#     --freq 0, 50 and 60 gave identical output on 50 Hz hum, and a hum-free file
#     came back sample for sample), so the change shows on tapes the scanner read
#     as hum-free. Not judged by ear yet: the C3 listening session decides.
#
# cathar_noiseprint_mute_guard (2026-10-12):
#   - false (Default): the noise print is learned from the quietest window
#     whatever it holds, as every release has.
#   - true: a candidate window that is a digital mute is left out of the pick,
#     single-window and stitched: half or more of its samples repeat the one
#     before (exact zeros, a held DC level), or it sits under -70 dBFS and 30 dB
#     under the p20 of the material's 23 ms frames (frames under -90 dBFS left
#     out of that p20). When every window is a mute the denoise runs without a
#     learned print. 7 of 136 IA clips picked a window under -70 dBFS; on those 7
#     (15 s, CPU, 2026-10-12) the pick moved on all 7 and removal rose a median
#     0.42 dB (0.01 to 2.60), while bbc-two-continuity's -86 dBFS analog floor
#     stayed sample for sample. lion-king-dodge lost 3.4 dB at 8-16 kHz: its new
#     window straddles the mute and programme. Not judged by ear yet; see
#     docs/configuration.md, "cathar Noise-Print Mute Guard". cathar mode only.
#
# cathar_enable_repair:
#   - Specialized non-linear transient spectral spike and dropout repair (default: true)
#
# cathar_repair_strength:
#   - Repair aggressiveness factor (suggested: 1 to 10, default: 4)
#   - Eliminates stubborn intermittent VHS head-switching bursts and dropouts.
#
# cathar_enable_dewow:
#   - Tape transport wow and flutter pitch drift correction (default: false, experimental)
#
# Remaining Cathar controls:
#   - cathar_enable_* switches accept true or false; enable only the stage needed.
#   - cathar_dewind_cutoff and cathar_mono_below_hz are frequencies in Hz.
#   - cathar_azimuth_method accepts 'gcc-phat' or 'correlation'; max_ms is milliseconds.
#   - cathar_inpaint_max_gap_ms is milliseconds; iterations is a positive count.
#   - cathar_declip_threshold is normalized peak amplitude from 0.0 to 1.0.
#   - cathar_enhance_method accepts 'replicate' or 'interpolate'.
#   - cathar_noiseprint_duration_s is the total quiet tape, in seconds, the noise print is
#     learned from on a tape of 120 s or more (twenty times the print): stitched from that many 0.75 s pauses spread
#     over the quietest fifth of the tape, because a single long window on dialogue
#     carries speech and the print then strips sibilance (measured: one 4 s window took
#     6 dB more off speech at 8-12 kHz than a 0.75 s one). Eight stitched pauses (6 s)
#     removed 6.7 dB of noise on a 134 s dialogue tape against 3.4 dB for the single
#     0.75 s window, at the same speech highs and with 5-6 dB less hiss in the pauses.
#     Material under twenty times the print (120 s at 6 s) keeps the single 0.75 s
#     window, so a 15 s clip is unchanged.
#     dehum_harmonics is a positive count.
#   - cathar_deplosive_strength, cathar_deesser_bands, and cathar_repair_strength
#     are positive stage-strength/count settings; cathar_deesser_freq is Hz and
#     cathar_dereverb_strength is a positive gain.
#   - cathar_deesser_threshold is dB and its meaning depends on cathar_deesser_bands:
#     with bands > 1 (default 3) it is dB ABOVE each band's running average (6 is
#     cathar's suggested value; 12, the listener round's plateau on speech, only
#     catches the loud 's'); with bands = 1 it is the HF/broadband ratio, where
#     cathar's default is -24. A negative value with bands > 1 keeps the de-esser
#     engaged on every frame and removes everything above cathar_deesser_freq
#     (measured -28 dB from 4-12 kHz on real tape: muffled, "underwater" speech).
# ------------------------------------------------------------------------------
cathar_denoise_method: "spectral"
cathar_alpha: 1.0
cathar_beta: 0.02
cathar_enable_coherent: false
cathar_enable_dewind: true
cathar_dewind_cutoff: 80
cathar_enable_azimuth: true
cathar_azimuth_method: "gcc-phat"
cathar_azimuth_max_ms: 5.0
cathar_enable_declick: true
cathar_declick_threshold: 8.0
cathar_enable_decrackle: true
cathar_decrackle_sensitivity: 6
cathar_enable_inpaint: true
cathar_inpaint_max_gap_ms: 50
cathar_inpaint_iterations: 3
cathar_enable_declip: true
cathar_declip_threshold: 0.95
cathar_declip_mode: "always"
cathar_enable_dehum: true
cathar_dehum_freq: "scanner"
cathar_enable_repair: true
cathar_repair_strength: 2
cathar_enable_dewow: false
cathar_enable_enhance: false
cathar_enhance_method: "replicate"
cathar_enable_noiseprint: true
cathar_noiseprint_duration_s: 4.5
cathar_noiseprint_mute_guard: false
cathar_dehum_adaptive: true
cathar_dehum_harmonics: 8
cathar_enable_mono_below: true
cathar_mono_below_hz: 100
cathar_enable_deplosive: true
cathar_deplosive_strength: 4
cathar_music_profile: true
cathar_music_persistence_min: 0.05
cathar_music_alpha: 0.5
cathar_music_enable_noiseprint: false
cathar_music_enable_coherent: true
cathar_music_enable_deplosive: false
cathar_music_enable_deesser: false
cathar_music_expander_depth_db: 4.0
cathar_music_crt_notch_q: 60.0
cathar_music_beta: 0.02
cathar_music_enable_repair: true
cathar_music_dewind_cutoff: 80
cathar_enable_deesser: true
cathar_deesser_bands: 3
cathar_deesser_freq: 4000
cathar_deesser_threshold: 12
cathar_enable_dereverb: false
cathar_dereverb_wpe: true
cathar_dereverb_strength: 2.0

# ------------------------------------------------------------------------------
# Advanced Audio Polish & Archival Preservation
# ------------------------------------------------------------------------------
# enable_deesser:
#   - true:  Applies dynamic sibilance control to tame harsh 's'/'sh' frequencies on enhanced speech (Default).
#   - false: Disabled.
#
# enable_loudnorm:
#   - true:  Applies two-pass EBU R128 loudness normalization (-16 LUFS, -1 dBTP) followed by a
#            sample-peak limiter (alimiter at -1 dBFS; see loudnorm_linear_fallback) (Default).
#   - false: Disabled.
#
# enable_dynamic_expander:
#   - true:  Applies smooth downward dynamic expansion on background track during dialogue pauses (Default).
#   - false: Disabled.
#
# enable_linear_air:
#   - true:  Applies a high-frequency presence shelf at linear_air_freq_hz (7500 Hz by default) to
#            auto_pure_linear (Default),
#            linear_air_gain_db dB high (1.0; 2.0 until 2026-10-08).
#            By ear (2026-10-08): the user heard APL's 's' as thin at +2 dB and picked +1 dB in an A/B
#            against +2 dB and off on the four Tata tapes. The shelf is the only thing that brightens the
#            's': on Vaccin's fricatives the APL output moves no more than on its other loud frames
#            (under 1 dB in every band), while the whole output carried ~+1.6 dB above 4 kHz. At +1 dB
#            8-12 kHz drops ~0.7 dB and 4-8 kHz ~0.3 dB; nothing below 4 kHz moves. The harness's
#            loops kept +2 dB: it does not read the brighter top as a fault.
#   - false: Disabled.
#
# linear_air_freq_hz:
#   - The air shelf's corner frequency in Hz (ffmpeg treble f, 1000-16000). 7500 is the
#     shelf every release has shipped (hard-coded until 2026-10-09), so outputs keep their
#     bytes. Round A1 (brightness) searches 6000 / 7500 / 9000 beside linear_air_gain_db;
#     not yet judged by ear. A lower corner lifts more: +1.5 dB at 6000 Hz lifts 4-8 kHz like
#     +2.57 dB at 7500 Hz, past the +2 dB round 3 rejected, so the tuning loop refuses it.
#
# expander_depth_db / expander_knee_offset_db:
#   - The expander's depth under its knee and the knee's offset above the scanner's
#     noise floor (7 dB / +4 dB were the curve v1.3.2 shipped). This is the stage that
#     turned a denoised pause into dead air on the auto_pure_linear outputs ("silent
#     in pauses"); the tuning loop searches both. The listener round put the knee
#     8 dB over the floor for every engine and material and kept 7 dB of depth for
#     cathar on speech; auto_pure_linear takes 12 dB (apl_expander_depth_db, in
#     modules/config.py) and cathar on music 4 dB (cathar_music_expander_depth_db).
#
# expander_attack_s / expander_decay_s:
#   - The same expander's attack and decay in seconds (compand attacks / decays): how
#     fast its level follower rises into a word and lets go after it, so how soon a
#     pause is pushed down. 0.04 / 0.18 are the times every release has shipped
#     (hard-coded until 2026-10-09), shared by both engines, so outputs keep their
#     bytes. Round A3 (pause texture) searches 0.02-0.08 / 0.12-0.3; not yet judged
#     by ear.
#
# enable_pause_floor / pause_floor_fill_db / pause_floor_quiet_percentile:
#   - The pause floor keeper: in the frames the source calls quiet (at or under its
#     quiet percentile level), an attenuated copy of the source is put back under the
#     restored audio so a pause keeps its own, quieter texture, pause_floor_fill_db
#     under the source's pause level. On since the listener round: all four loops
#     accepted it at 12 dB and none moved it (8 and 18 dB lost every round).
#
# pause_floor_target (both engines, 2026-10-12):
#   - 'cluster' (Default): every pause is aimed at one level, the quiet frames'
#     median minus pause_floor_fill_db, as every release has; outputs keep their
#     bytes. The hiss diagnosis of 2026-10-11 found three ways it misses: that
#     median sits 9-15 dB over the true pauses on dense speech or music; where the
#     neural stage passed the floor the fill adds on top of it (+5.6 dB over the
#     source on dvd-205405-0); and the separator's peak normalisation drops the
#     programme up to 10.6 dB, so the fill sits that much too loud (fourstarrevue's
#     pauses +1.8 dB over the source).
#   - 'frame': each quiet frame is aimed at pause_floor_fill_db under the source
#     frame, scaled by the restored programme's gain on the source's loud frames
#     (p70 and up); a frame already at its target gets nothing. CPU replay on the
#     diagnosis work directories (the paused WAV, before the mux): true-pause hiss
#     (3-16 kHz band median against the source) -7.6 -> -13.4 dB over 120 hunt
#     clips, SOTI -10.9 -> -13.0, Tele7abc -3.5 -> -12.6; hunt clips with pause
#     hiss over the source 10 -> 3, pause LF over it 27 -> 11.
#
# pause_floor_shape / pause_floor_shelf_hz / pause_floor_hf_cut_db:
#   - 'flat' (Default): the fill is the source as it is, its tape hiss included.
#   - 'shelf': the fill is the source cut pause_floor_hf_cut_db above
#     pause_floor_shelf_hz (a 4th-order Butterworth low-pass run forward and
#     backward, plus the rest that many dB down); 'lowpass': low-passed there (2nd
#     order, forward and backward; the cut is unused). The pause keeps its room tone
#     and loses the hiss, and the deficit is read through the same shaping, so a
#     hiss burst left in a pause never stands in for the body. Replayed with
#     'frame': hunt true-pause hiss -30.3 dB ('shelf') / -40.3 dB ('lowpass') with
#     the pause LF at -7.6 dB, as with no fill; SOTI -30.8 and Tele7abc -30.5 dB
#     with the LF at -11.3 / -11.8 and gap_air at -20.0 / -11.7 dB. The -25 dB
#     dead-air flag trips on 16 of 234 hunt clips with 'shelf', 11 today, 24 with
#     no fill. 3000 Hz / 18 dB are the prototype's guesses; a GPU render and a
#     blind A/B decide every non-default value here.
#
# loudnorm_target_lra:
#   - The mux's EBU R128 loudness-range target. ffmpeg's loudnorm holds its linear
#     mode only while the measured range is at or under it; a denoised interview with
#     silent pauses measures well above the broadcast 11 LU and the mux then rides the
#     gain between words. The run log states the measured range and the mode. 20 is
#     the listener round's plateau, accepted by all four loops.
#
# loudnorm_linear_fallback:
#   - What the mux does when loudnorm would leave its linear mode only because of the
#     true-peak rule. ffmpeg holds linear mode only while the measured true peak plus
#     the gain to -16 LUFS stays at or under -1 dBTP, the measured range stays at or
#     under loudnorm_target_lra, and the measurement is set (I and LRA not 0, TP not
#     99, threshold not -70), except that a programme under 3 s always runs linear
#     (mastering.linear_mode_blockers is the rule, the short case included when the
#     mux passes the duration). The run log now applies all of it; it used to check
#     the range alone, and of the 616 distinct decisions it logged as "linear" in the
#     repository's run logs on 2026-10-09, 229 (37%) broke the true-peak half and ran
#     dynamic.
#   - 'ffmpeg' (Default): loudnorm falls back to its dynamic mode and rides the gain,
#     as every release so far has; every output keeps its bytes.
#   - 'gain_limiter': one gain to the target (volume) and the mux's existing limiter
#     on the peaks instead. A range over its target still goes to loudnorm. That
#     limiter is alimiter at -1 dBFS on the samples, not a true-peak limiter: on
#     synthetic programmes with clicks the render peaked at up to +0.24 dBTP, where
#     loudnorm's dynamic mode held -1.8. With AI_RESTORE_EVENT_LOG set the render's
#     true peak is measured and recorded. Not yet judged by ear; the pause-texture
#     round decides it.
#
# apl_post_neural_suppress / apl_post_neural_suppress_floor_gap_db /
# apl_post_neural_suppress_min_residual_db (auto_pure_linear only):
#   - The hiss the Mel-RoFormer passes. The neural stage is the only one in this mode
#     that removes hiss, and it is nearly an identity on music and adverts; on some
#     hiss-dominated tapes it passes the floor too, mostly in 3-4.8 kHz (in energy,
#     -4.4/-7.7 dB under the programme there against cathar's -8.0/-9.2; diagnosis of
#     2026-10-11). On, the mode's MMSE-LSA suppressor runs after the sibilant guard,
#     its noise learned from the post-neural audio's quietest stretch
#     (apl_suppress_noise_bias, apl_suppress_gain_floor_db, apl_suppress_dd_alpha,
#     apl_noiseprint_duration_s), on a tape whose 8-16 kHz band is hiss-dominated
#     (median minus p10 of its frame energy at or under floor_gap_db, 3.0) and whose
#     floor under the programme the neural stage left within min_residual_db (6.0) of
#     the source's, on the 3-16 kHz band median or the 3-4.8 kHz energy. CPU replay on
#     the diagnosis's work folders: the gate opens on 47 of 235 hunt clips (10 on the
#     band median alone) and on none of the Tata excerpts or music clips. Followed by
#     the prototype's per-frame shelved pause fill it renders the prototype's numbers
#     exactly (its 10 clips, 9 of which this gate opens on: floor under the programme
#     -15.7 dB, loud-frame 8-16 kHz -3.5 dB, musical noise lkr 0.39). Followed by
#     today's pause floor it makes the pauses worse, because the floor refills what
#     the suppressor lowered with the source's hiss: on the 48 clips the gate opens on
#     the pause hiss rose on 19 of the 27 with pauses, by 29-81 dB on 7, and the floor
#     under the programme rose on 6, by up to 19 dB. Ungated it ate music's highs.
#     false (Default): every output keeps its bytes; a GPU render with the per-frame
#     pause fill and a listening session judge it.
#
# apl_neural_level_restore (auto_pure_linear only):
#   - The separator peak-normalises to 0.9, so a hot or declipped tape leaves the
#     neural stage up to 10.7 dB quieter (fourstarrevue) and the expander's knee and
#     the pause floor's target read the wrong level. true scales the neural output back
#     by the loud-frame projection gain (within 0.1 dB of the separator's peak ratio on
#     all 26 replayed clips that peaked over 0.9); a gain under 0.5 dB is left alone.
#     false (Default): every output keeps its bytes.
#
# linear_air_gate (auto_pure_linear only):
#   - 'none' (Default): the air shelf (linear_air_gain_db) on every tape, as every
#     release has. 'hiss_dominated': skipped where the post-neural hiss gate opens; on
#     those tapes the shelf lifted the residual 0.35 dB under the programme (replay
#     median) and 0.67 dB in the loud frames' 8-16 kHz.
#
# mux_limiter_latency_compensation:
#   - The mux's limiter (alimiter at -1 dBFS) delays the audio by its lookahead: a
#     synthetic impulse at sample 10000 came out at 10219, 219 samples or 4.97 ms at
#     44.1 kHz (ffmpeg 9.0.1), so every output of every mode plays 4.97 ms late against
#     its video and against the preserved original track.
#   - false (Default): the limiter as every release has run it; every output keeps its
#     bytes, which cathar's identity check compares.
#   - true: alimiter's latency=1 removes the delay (the impulse stayed at 10000, the
#     length unchanged). A pure time shift; it needs the user's sign-off on re-basing
#     the identity check before it becomes the default.
#
# mux_sample_rate:
#   - Every stage runs at 44.1 kHz; this is the rate the mux encodes the restored track
#     at. The source's audio start time is always kept: the restored track starts where
#     the source's audio started against the video (it used to start with the video:
#     a 48 kHz MPEG-PS capture with its audio 5.578 ms after the video came out with it
#     10.911 ms before).
#   - 'pipeline' (Default): 44.1 kHz in every container except MPEG-PS (.mpg/.mpeg),
#     which keeps the source's rate (DVD-Video allows MP2 only at 48 kHz; a rate MP2
#     cannot encode goes to 48 kHz). Every other container keeps its bytes.
#   - 'source': every container keeps the source's rate when its codec encodes it
#     (AAC's and MP2's rates; PCM takes any). Changes every 48 kHz source's bytes.
#
# crt_notch_q:
#   - Q of the CRT line-whistle notch in the pre-conditioning graph (30 is the shipped
#     width; cathar's music profile narrows it to cathar_music_crt_notch_q).
#
# preserve_original_audio_track:
#   - true:  Preserves original untouched audio as Stream 2 alongside restored audio in container.
#   - false: Output container contains restored clean audio track only (Default).
# ------------------------------------------------------------------------------
enable_deesser: true
enable_loudnorm: true
enable_dynamic_expander: true
expander_depth_db: 7.0
expander_knee_offset_db: 8.0
expander_attack_s: 0.04
expander_decay_s: 0.18
enable_pause_floor: true
pause_floor_fill_db: 12.0
pause_floor_quiet_percentile: 15.0
pause_floor_target: "cluster"
pause_floor_shape: "flat"
pause_floor_shelf_hz: 3000.0
pause_floor_hf_cut_db: 18.0
loudnorm_target_lra: 20.0
loudnorm_linear_fallback: "ffmpeg"
mux_limiter_latency_compensation: false
mux_sample_rate: "pipeline"
crt_notch_q: 30.0
enable_linear_air: true
linear_air_gain_db: 1.0
linear_air_freq_hz: 7500.0
linear_air_gate: "none"
apl_post_neural_suppress: false
apl_post_neural_suppress_floor_gap_db: 3.0
apl_post_neural_suppress_min_residual_db: 6.0
apl_neural_level_restore: false
preserve_original_audio_track: false

# ------------------------------------------------------------------------------
# Supported Video Extensions
# ------------------------------------------------------------------------------
# The application defines a whitelist of video file extensions to scan for within
# the 'input/' directory. Files not matching these extensions will be ignored.
#
# Format: List of strings (must include the leading dot, e.g., '.mp4').
# Case Sensitivity: The scanner is case-insensitive (accepts .MP4 and .mp4).
# ------------------------------------------------------------------------------
extensions:
  - .mp4
  - .mkv
  - .mpg
  - .mpeg
  - .avi
  - .mov
  - .ts
  - .m2ts

# ------------------------------------------------------------------------------
# DEBUGGING
# ------------------------------------------------------------------------------
# debug_logging:
#   - false: Standard output (Recommended).
#   - true:  Detailed terminal logs for troubleshooting.
# ------------------------------------------------------------------------------
debug_logging: false
