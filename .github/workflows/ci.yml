name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.1"

jobs:
  validation:
    name: "🔍 Static Quality Verification + Automated Pipeline Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12.13"
      - name: Install Poetry
        shell: bash
        run: |
          curl -sSL https://install.python-poetry.org | python - --version "${{ env.POETRY_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure Poetry In-Project Virtualenv
        shell: bash
        run: |
          poetry config virtualenvs.in-project true
      - name: Refresh Poetry Lockfile
        shell: bash
        run: |
          poetry lock --no-interaction
          poetry check --lock
      - name: Sync Test/Light Dependencies
        shell: bash
        run: |
          poetry sync --only main,dev --no-root
      - name: Run PowerShell Lint
        shell: pwsh
        run: |
          $scriptPaths = @(
            "./install_dependencies.ps1",
            "./run_pipeline_locally.ps1",
            "./scripts/install_pr_review_tooling.ps1",
            "./.github/scripts/Invoke-PowerShellLint.ps1"
          )
          & ./.github/scripts/Invoke-PowerShellLint.ps1 -ScriptPaths $scriptPaths
      - name: Run Ruff
        run: |
          poetry run ruff check modules tests restore_audio_hybrid.py scripts/apply_patches.py
      - name: Run Black
        run: |
          poetry run black --check modules tests restore_audio_hybrid.py scripts/apply_patches.py
      - name: Run isort
        run: |
          poetry run isort --check-only --diff modules tests restore_audio_hybrid.py scripts/apply_patches.py
      - name: Run Taplo (TOML format check)
        shell: bash
        run: |
          TOML_FILES=$(git ls-files '*.toml')
          if [ -n "$TOML_FILES" ]; then
            poetry run taplo fmt --check $TOML_FILES
          fi
      - name: Run Flake8
        run: |
          poetry run flake8 modules tests restore_audio_hybrid.py scripts/apply_patches.py
      - name: Run Pylint
        run: |
          poetry run pylint --errors-only modules tests restore_audio_hybrid.py scripts/apply_patches.py
      - name: Run Bandit
        run: |
          poetry run bandit -ll -ii -r modules restore_audio_hybrid.py scripts/apply_patches.py
      - name: Run pip-audit
        run: |
          poetry run pip-audit
      - name: Run Radon Gates and Reports
        shell: bash
        run: |
          poetry run radon cc modules tests/conftest.py tests/unit tests/integration restore_audio_hybrid.py scripts/apply_patches.py -s > radon-report.txt
          poetry run radon cc modules tests/conftest.py tests/unit tests/integration restore_audio_hybrid.py scripts/apply_patches.py -j -O radon-cc-report.json
          poetry run radon mi modules tests/conftest.py tests/unit tests/integration restore_audio_hybrid.py scripts/apply_patches.py -s > radon-mi-report.txt
          poetry run radon mi modules tests/conftest.py tests/unit tests/integration restore_audio_hybrid.py scripts/apply_patches.py -j -O radon-mi-report.json
          poetry run radon raw modules tests/conftest.py tests/unit tests/integration restore_audio_hybrid.py scripts/apply_patches.py > radon-raw-report.txt
          poetry run radon hal modules tests/conftest.py tests/unit tests/integration restore_audio_hybrid.py scripts/apply_patches.py > radon-hal-report.txt
          {
            echo "## Radon Cyclomatic Complexity"
            echo
            echo '```text'
            cat radon-report.txt
            echo '```'
            echo
            echo "## Radon Maintainability Index"
            echo
            echo '```text'
            cat radon-mi-report.txt
            echo '```'
            echo
            echo "## Radon Raw Metrics"
            echo
            echo '```text'
            cat radon-raw-report.txt
            echo '```'
            echo
            echo "## Radon Halstead Metrics"
            echo
            echo '```text'
            cat radon-hal-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cc_gate_status=0
          mi_gate_status=0
          poetry run python tests/tooling/radon_cc_gate.py radon-cc-report.json || cc_gate_status=$?
          poetry run python tests/tooling/radon_mi_gate.py radon-mi-report.json || mi_gate_status=$?
          if [ "$cc_gate_status" -ne 0 ] || [ "$mi_gate_status" -ne 0 ]; then
            exit 1
          fi
      - name: Run Markdown Auto-Delint Check
        run: |
          poetry run mdformat --check README.md AGENTS.md .agent docs tests/README.md
      - name: Run Markdown Lint
        run: |
          poetry run pymarkdown scan README.md AGENTS.md .agent docs tests/README.md
      - name: Run Tests with Coverage
        run: |
          poetry run pytest -o addopts= --cov=restore_audio_hybrid --cov=modules --cov-branch \
            --cov-report=xml --cov-report=json --cov-report=term --cov-fail-under=90 tests/
      - name: Enforce Strict Per-File Coverage
        run: |
          poetry run python tests/tooling/quality_gate.py coverage.json --threshold 90.0
      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-artifacts
          path: |
            coverage.xml
            coverage.json
            .coverage
            radon-report.txt
            radon-cc-report.json
            radon-mi-report.txt
            radon-mi-report.json
            radon-raw-report.txt
            radon-hal-report.txt

  quality_reporting:
    name: "📊 Analytics & Coverage Reporting"
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Setup Python Runtime
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12.13"
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-artifacts
      - name: Generate Coverage Summary
        run: |
          python tests/tooling/badge_report.py coverage.xml --summary >> $GITHUB_STEP_SUMMARY
